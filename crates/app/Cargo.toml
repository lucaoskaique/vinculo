[package]
name = "vinculo"
version.workspace = true
edition.workspace = true

[dependencies]
vinculo-core = { path = "../core" }
vinculo-storage = { path = "../storage" }
vinculo-audio = { path = "../audio" }
vinculo-ai = { path = "../ai" }
vinculo-relatorio = { path = "../relatorio" }
slint = "1"
chrono.workspace = true
anyhow.workspace = true
open = "5"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
self-replace = "1"

[build-dependencies]
slint-build = "1"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
