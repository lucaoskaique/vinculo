name: Release

# Multi-platform builds run ONLY on version tags (v0.1.0, v0.2.0, …).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            binary: vinculo.exe
            artifact: vinculo-windows-x64.exe
          - os: macos-latest
            target: macos-arm64
            binary: vinculo
            artifact: vinculo-macos-arm64
          # Free Intel runners (macos-13) were retired by GitHub;
          # the Intel binary is cross-compiled on the ARM runner.
          - os: macos-latest
            target: macos-x64
            rust_target: x86_64-apple-darwin
            binary: vinculo
            artifact: vinculo-macos-x64
          - os: ubuntu-latest
            target: linux-x64
            binary: vinculo
            artifact: vinculo-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Check Cargo version vs tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          if [ "$TAG" != "$VER" ]; then
            echo "::error::Tag v$TAG does not match version $VER in Cargo.toml (the auto-updater compares versions)."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang pkg-config libasound2-dev libssl-dev libfontconfig1-dev

      - name: libclang and perl (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          # The MSYS2 perl (from Git) takes priority in PATH but lacks the
          # modules that OpenSSL's Configure requires; force Strawberry Perl.
          echo "OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe" >> $env:GITHUB_ENV

      - name: Build
        shell: bash
        run: |
          if [ -n "${{ matrix.rust_target }}" ]; then
            cargo build --release -p vinculo --target "${{ matrix.rust_target }}"
          else
            cargo build --release -p vinculo
          fi

      - name: Rename binary
        shell: bash
        run: |
          if [ -n "${{ matrix.rust_target }}" ]; then
            cp "target/${{ matrix.rust_target }}/release/${{ matrix.binary }}" "${{ matrix.artifact }}"
          else
            cp "target/release/${{ matrix.binary }}" "${{ matrix.artifact }}"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      # Windows installer (Inno Setup): installs per-user under
      # %LOCALAPPDATA%\Programs\Vinculo with shortcuts and an uninstaller.
      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $env:VINCULO_VERSAO = "$env:GITHUB_REF_NAME".TrimStart("v")
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" instalador\vinculo.iss

      - name: Upload installer artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: vinculo-setup-windows.exe
          path: instalador/Output/vinculo-setup-windows.exe

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: vinculo-*
          generate_release_notes: true
